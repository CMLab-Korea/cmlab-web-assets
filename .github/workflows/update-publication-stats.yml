name: Sync CMLab publication statistics

on:
  workflow_dispatch:
  schedule:
    # Every 6 hours in UTC
    - cron: '17 */6 * * *'

permissions:
  contents: write
  pages: write

concurrency:
  group: cmlab-publication-statistics
  cancel-in-progress: false

jobs:
  sync-publication-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Check out asset repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser for Google Sites rendering
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium

      - name: Parse rendered Publications Summary and generate JS
        run: python scripts/sync_publication_stats.py

      - name: Commit updated statistics when changed
        id: update
        shell: bash
        run: |
          git add data/publication-stats.js
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo 'No new publication counts; skipping commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Auto-update CMLab publication statistics'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Request GitHub Pages rebuild after statistics update
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
